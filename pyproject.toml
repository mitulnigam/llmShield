[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmshield"
version = "0.1.0"
description = "Open-source starter lab for responsible LLM security testing"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "httpx>=0.27,<1.0", "pydantic>=2.7,<3.0", "requests>=2.32,<3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
